name: Build Quick Launcher

on:
  push:
    branches: [master, feat/m1-ui]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quick-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Build renderer and main process
        run: pnpm run build

  package-macos:
    name: Package macOS ARM64
    runs-on: macos-14
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run macOS Electron E2E suite
        run: pnpm run test:e2e
      - name: Build macOS installers
        run: pnpm run dist:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-launcher-macos-arm64
          path: |
            release/**/*.dmg
            release/**/*.zip
          if-no-files-found: error

  package-windows:
    name: Package Windows x64
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Windows test suite
        run: pnpm test
      - name: Run Windows Electron E2E suite
        run: pnpm run test:e2e
        env:
          DEBUG: pw:browser
          QUICK_LAUNCHER_DIAGNOSTICS: '1'
      - name: Upload Windows E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-launcher-windows-e2e-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Build Windows installer
        run: pnpm run dist:win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-launcher-windows-x64
          path: release/**/*.exe
          if-no-files-found: error
